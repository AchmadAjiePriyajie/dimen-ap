services:
  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: bki_root
      MYSQL_DATABASE: bki_ap
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-pbki_root"]
      interval: 5s
      timeout: 5s
      retries: 30

  app:
    build: .
    environment:
      DATABASE_URL: mysql://root:bki_root@db:3306/bki_ap
      TZ: Asia/Jakarta
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
    restart: on-failure

volumes:
  db_data:
